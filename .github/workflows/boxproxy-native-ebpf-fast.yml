name: BoxProxy Native eBPF Fast Build

on:
  workflow_dispatch:
  push:
    branches:
      - integration/boxproxy-native-ebpf
    paths:
      - ".github/workflows/boxproxy-native-ebpf-fast.yml"
      - ".github/fixtures/boxproxy-ebpf-listener.yaml"
      - ".github/fixtures/ip-family-routing.yaml"
      - "adapter/capability.go"
      - "adapter/outboundgroup/**"
      - "common/ebpf/**"
      - "component/smart/**"
      - "listener/**"

permissions:
  contents: read

concurrency:
  group: boxproxy-native-ebpf-fast
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  fast:
    name: Parser + Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Source identity
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=$HEAD_SHORT" >> "$GITHUB_ENV"

      - name: Build Linux validation core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath               -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=se-test-$HEAD_SHORT' -w -s -buildid="               -o mihomo-selftest

      - name: Parse BoxProxy native eBPF + Smart config
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-selftest -t -f .github/fixtures/boxproxy-ebpf-listener.yaml 2>&1 | tee BOXPROXY_SCHEMA_SELFTEST.txt
          grep -qi "configuration file .* test is successful" BOXPROXY_SCHEMA_SELFTEST.txt

      - name: Parse custom IP-family directives
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-selftest -t -f .github/fixtures/ip-family-routing.yaml 2>&1 | tee IP_FAMILY_SELFTEST.txt
          grep -qi "configuration file .* test is successful" IP_FAMILY_SELFTEST.txt

      - name: Android arm64 build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          strings "$OUT" | grep -q "component/smart"
          strings "$OUT" | grep -q "listener/sing_ebpf"
          strings "$OUT" | grep -q "api4.ipify.org"
          strings "$OUT" | grep -q "api6.ipify.org"
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "base=liuran001/mihomo:Alpha"
            echo "boxproxy_schema=listeners.type=ebpf"
            echo "target=android/arm64"
            echo "tags=with_gvisor with_ebpf"
            echo "cgo=0"
          } > BUILD_INFO.txt

      - uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-a64-fast-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            FILE_INFO.txt
            BOXPROXY_SCHEMA_SELFTEST.txt
            IP_FAMILY_SELFTEST.txt
            .github/fixtures/boxproxy-ebpf-listener.yaml
            .github/fixtures/ip-family-routing.yaml
          if-no-files-found: error
          retention-days: 30
