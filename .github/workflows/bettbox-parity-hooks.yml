name: Bettbox Parity Hooks

on:
  push:
    branches:
      - integration/bettbox-feature-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test hook packages with race detector
        run: go test -race -count=1 ./adapter ./adapter/provider ./tunnel/statistic ./component/smart ./component/smart/lightgbm ./component/updater
