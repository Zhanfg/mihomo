name: Mobile Core Fast

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-core-opt
    paths:
      - ".github/workflows/mobile-core-fast.yml"

permissions:
  contents: read

concurrency:
  group: mobile-core-fast
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Source
        shell: bash
        run: |
          set -euo pipefail
          S="$(git rev-parse HEAD)"
          echo "HEAD_SHA=$S" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=${S:0:7}" >> "$GITHUB_ENV"

      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter -run 'Test(IPv4|IPv6|IPFamily|Capability|ExitCountry|ProxyIdentity)' -count=1
          go test ./component/keepalive -count=1

      - name: Build Android arm64
        shell: bash
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          TAGS="with_ebpf no_tailscale no_zerotier no_easytier"
          go build -buildvcs=false -tags "$TAGS" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "target=android/arm64"
            echo "tags=$TAGS"
            echo "gvisor=excluded"
            echo "tailscale=excluded"
            echo "zerotier=excluded"
            echo "easytier=excluded"
            echo "keepalive=android-default-60s/20s"
            echo "country-routing=existing-MMDB"
          } > BUILD_INFO.txt

      - uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-mobile-fast-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            FILE_INFO.txt
          if-no-files-found: error
          retention-days: 30
