name: Smart Android eBPF Fast Release

on:
  workflow_dispatch:
  push:
    branches:
      - test/smart-alpha-routing-sim
    paths:
      - ".github/workflows/smart-android-ebpf-fast-release.yml"

permissions:
  contents: read

concurrency:
  group: smart-android-ebpf-fast-release
  cancel-in-progress: true

jobs:
  build:
    name: Latest Alpha + eBPF / Android arm64 fast build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout patch source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reset source to latest upstream Alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Smart Release CI"
          git config user.email "smart-release-ci@users.noreply.github.com"
          git fetch --no-tags https://github.com/vernesong/mihomo.git \
            Alpha:refs/remotes/smart-upstream/Alpha
          git fetch --no-tags origin \
            feature/android-ebpf-routing:refs/remotes/origin/feature/android-ebpf-routing
          UPSTREAM_SHA="$(git rev-parse refs/remotes/smart-upstream/Alpha)"
          UPSTREAM_SHORT="$(printf '%s' "$UPSTREAM_SHA" | cut -c1-7)"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$UPSTREAM_SHORT" >> "$GITHUB_ENV"
          git reset --hard "$UPSTREAM_SHA"

      - name: Apply validated Android eBPF patch stack
        shell: bash
        run: |
          set -euo pipefail
          PATCHES=(
            a2a6b2f6bc9dd7a1bf00ffd275c92202e001bb8f
            47d088f34775ff8733e839372c135d235d7fac72
            1e145e4fc75f04d2a6e67d2406819edc37a01de1
            01c43bf02c8a42be7891c50cc8509279337f4032
            ef06639bc8af6cd721c9f93cc0f0f70b986c951e
            c967e100385d29980a2158cd777405d2ac71a296
            938c1cc5c06115dd6cd67a5143bab03c47606161
            b22228b1967035449de8dd0059918f708d08caf8
            45767839f0a785822cf91b060f1322c4c5acc106
            33fb54474043a22dcc73ae28678fffe69ac62632
            6c3591ecbd096287ae970679074ea9fd8ca09c9a
            4f88f5a5eafe6d304ab8e7c2c8dcb050e5cdfc9d
          )
          printf '%s\n' "${PATCHES[@]}" > EBPF_PATCHES.txt
          for sha in "${PATCHES[@]}"; do
            git cherry-pick "$sha"
          done
          git log --oneline -15 > APPLIED_COMMITS.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29-beta1

      - name: Prepare embedded CA bundle and patch dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/ssl/certs/ca-certificates.crt
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt
          go mod tidy

      - name: Self-test Smart parser before Android build
        shell: bash
        run: |
          set -euo pipefail
          cat > smart-parser-selftest.yaml <<'YAML'
          mixed-port: 17890
          allow-lan: false
          mode: rule
          log-level: warning
          proxy-groups:
            - name: SMART_SELFTEST
              type: smart
              proxies: [DIRECT]
              url: http://127.0.0.1:1/generate_204
              interval: 300
              lazy: true
              timeout: 500
              expected-status: 204
              uselightgbm: false
          rules:
            - MATCH,SMART_SELFTEST
          YAML
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath               -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-parser-selftest' -w -s -buildid="               -o mihomo-smart-parser-selftest
          ./mihomo-smart-parser-selftest -t -f smart-parser-selftest.yaml 2>&1 | tee SMART_SELFTEST.txt
          grep -qi "configuration file" SMART_SELFTEST.txt || true

      - name: Build final Android arm64 Smart eBPF core
        shell: bash
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          export CC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          VERSION="smart-alpha-ebpf-$UPSTREAM_SHORT"
          OUT="mihomo-android-arm64-smart-ebpf-$UPSTREAM_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid=" \
            -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          strings "$OUT" | grep -q "github.com/metacubex/mihomo/component/smart"
          strings "$OUT" | grep -q "\[Smart\]"
          echo "smart_symbols=present" > SMART_BINARY_CHECK.txt
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "upstream_alpha=$UPSTREAM_SHA"
            echo "version=$VERSION"
            echo "go=$(go version)"
            echo "ndk=r29-beta1"
            echo "tags=with_gvisor with_ebpf"
            echo "target=android/arm64"
          } > BUILD_INFO.txt

      - name: Upload final core
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-smart-alpha-ebpf-android-arm64-${{ env.UPSTREAM_SHORT }}
          path: |
            mihomo-android-arm64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            FILE_INFO.txt
            EBPF_PATCHES.txt
            APPLIED_COMMITS.txt
            SMART_SELFTEST.txt
            SMART_BINARY_CHECK.txt
          if-no-files-found: error
          retention-days: 30
