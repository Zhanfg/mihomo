name: BoxProxy Native eBPF Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - integration/boxproxy-native-ebpf
    paths:
      - ".github/workflows/boxproxy-native-ebpf-android.yml"
      - ".github/fixtures/boxproxy-ebpf-listener.yaml"
      - ".github/fixtures/ip-family-routing.yaml"
      - ".github/fixtures/mobile-core-opt.yaml"
      - "adapter/adapter.go"
      - "adapter/capability.go"
      - "adapter/capability_tier_test.go"
      - "listener/**"
      - "common/ebpf/**"
      - "adapter/outboundgroup/**"
      - "component/smart/**"
      - "component/keepalive/**"
      - "dns/connection_pool.go"
      - "hub/executor/concurrent_load_*.go"

permissions:
  contents: read

concurrency:
  group: boxproxy-native-ebpf-android
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  validate-build:
    name: BoxProxy schema + Smart + Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Report source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=$HEAD_SHORT" >> "$GITHUB_ENV"
          git log -1 --oneline
          go version

      - name: eBPF listener parser tests
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -tags "with_gvisor with_ebpf" ./listener/inbound ./listener/sing_ebpf -count=1

      - name: IP-family capability regressions
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./adapter -run 'Test(IPv4|IPv6|IPFamily|Capability|AddCapability|ExitCountry|ProxyIdentity)' -count=1
          CGO_ENABLED=0 go test ./adapter/outboundgroup -run 'Test(CustomIPFamily|RequireCapability|URLTest|Smart)' -count=1

      - name: Smart regressions
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./adapter/outboundgroup ./component/smart/... -count=1

      - name: Keepalive regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./component/keepalive -count=1
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go test -c ./component/keepalive -o /tmp/keepalive-android.test

      - name: DNS/executor regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./dns -count=1
          go test ./hub/executor -count=1

      - name: Build Linux parser self-test core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath               -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=se-test-$HEAD_SHORT' -w -s -buildid="               -o mihomo-boxproxy-ebpf-selftest

      - name: Parse exact BoxProxy listener fixture
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-boxproxy-ebpf-selftest             -t -f .github/fixtures/boxproxy-ebpf-listener.yaml             2>&1 | tee BOXPROXY_SCHEMA_SELFTEST.txt
          grep -qi "configuration file .* test is successful" BOXPROXY_SCHEMA_SELFTEST.txt

      - name: Parse custom IP-family directives
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-boxproxy-ebpf-selftest -t -f .github/fixtures/ip-family-routing.yaml 2>&1 | tee IP_FAMILY_SELFTEST.txt
          grep -qi "configuration file .* test is successful" IP_FAMILY_SELFTEST.txt

      - name: Parse mobile whole-core directives
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-boxproxy-ebpf-selftest -t -f .github/fixtures/mobile-core-opt.yaml 2>&1 | tee MOBILE_SELFTEST.txt
          grep -qi "configuration file .* test is successful" MOBILE_SELFTEST.txt

      - name: Verify documented BoxProxy keys are accepted
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type: ebpf' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'include-uid:' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'ipv6-mode:' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'network:' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'case "ebpf":' listener/parse.go
          grep -q 'inbound:"include-uid,omitempty"' listener/config/ebpf.go
          grep -q 'inbound:"ipv6-mode,omitempty"' listener/config/ebpf.go

      - name: Build Android arm64 core
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          strings "$OUT" | grep -q "github.com/metacubex/mihomo/component/smart"
          strings "$OUT" | grep -q "listener/sing_ebpf"
          strings "$OUT" | grep -q "api4.ipify.org"
          strings "$OUT" | grep -q "api6.ipify.org"
          strings "$OUT" | grep -q "country-affinity"
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "base=liuran001/mihomo:Alpha"
            echo "boxproxy_schema=listeners.type=ebpf"
            echo "target=android/arm64"
            echo "tags=with_gvisor with_ebpf"
            echo "cgo=0"
            echo "android_keepalive_default=idle60s,interval20s"
            echo "country_routing=MMDB reuse,no new database"
          } > BUILD_INFO.txt

      - name: Upload Android core
        uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-a64-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            FILE_INFO.txt
            BOXPROXY_SCHEMA_SELFTEST.txt
            IP_FAMILY_SELFTEST.txt
            MOBILE_SELFTEST.txt
            .github/fixtures/boxproxy-ebpf-listener.yaml
            .github/fixtures/ip-family-routing.yaml
            .github/fixtures/mobile-core-opt.yaml
          if-no-files-found: error
          retention-days: 30
