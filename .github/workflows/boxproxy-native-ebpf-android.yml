name: BoxProxy Native eBPF Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - integration/boxproxy-native-ebpf
      - opt/smart-link-v2
      - opt/smart-greedy-v3
      - opt/smart-greedy-v4
      - opt/smart-learning-v5
      - opt/smart-runtime-v6
      - opt/smart-model-v7
      - opt/smart-box-v8
    paths:
      - ".github/workflows/boxproxy-native-ebpf-android.yml"
      - ".github/fixtures/boxproxy-ebpf-listener.yaml"
      - ".github/fixtures/ip-family-routing.yaml"
      - ".github/fixtures/mobile-core-opt.yaml"
      - "adapter/adapter.go"
      - "adapter/capability.go"
      - "adapter/capability_tier_test.go"
      - "adapter/path_profile.go"
      - "adapter/path_profile_test.go"
      - "adapter/stun_mapping_test.go"
      - "listener/**"
      - "common/ebpf/**"
      - "adapter/outboundgroup/**"
      - "adapter/provider/**"
      - "adapter/outbound/masque.go"
      - "adapter/outbound/masque_weaknet_test.go"
      - "component/smart/**"
      - "component/linkprofile/**"
      - "component/netstate/**"
      - "component/netchange/**"
      - "component/keepalive/**"
      - "dns/connection_pool.go"
      - "hub/executor/concurrent_load_*.go"
      - "tunnel/statistic/**"
      - "tools/install-smart-v7-box.sh"
      - "tools/install-smart-v8-box.sh"
      - "tools/test-smart-v8-installer.sh"

permissions:
  contents: write

concurrency:
  group: boxproxy-native-ebpf-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  validate-build:
    name: BoxProxy schema + Smart + Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Report source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=$HEAD_SHORT" >> "$GITHUB_ENV"
          git log -1 --oneline
          go version

      - name: IP-family capability regressions
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./adapter -run 'Test(IPv4|IPv6|IPFamily|Capability|AddCapability|ExitCountry|ProxyIdentity|PathProfile|TunnelPath|STUN)' -count=1
          CGO_ENABLED=0 go test ./adapter/outboundgroup -run 'Test(CustomIPFamily|RequireCapability|URLTest|Smart)' -count=1

      - name: Smart regressions
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./adapter/outboundgroup ./component/smart/... -count=1

      - name: Smart selector microbenchmark
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./component/smart -run '^$' -bench 'BenchmarkRankTargetStats(Top10|FullSortBaseline)$' -benchtime=50x -benchmem | tee SMART_BENCH.txt

      - name: Smart runtime microbenchmarks
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./adapter -run '^$' \
            -bench '^BenchmarkCapabilitySnapshotReuse$' -benchmem \
            | tee CAPABILITY_SNAPSHOT_BENCH.txt
          CGO_ENABLED=0 go test ./adapter/outboundgroup -run '^$' \
            -bench '^BenchmarkSmartStats(Closure|Event)Queue$' -benchmem \
            | tee SMART_STATS_EVENT_BENCH.txt

      - name: Current Smart model smoke
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/tmp/Model.bin
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin \
            -o "$MODEL"
          test "$(stat -c%s "$MODEL")" -gt 1000000
          MIHOMO_SMART_MODEL="$MODEL" CGO_ENABLED=0 \
            go test ./component/smart/lightgbm -run '^TestCurrentModelSmoke$' -count=1
          MIHOMO_SMART_MODEL="$MODEL" CGO_ENABLED=0 \
            go test ./component/smart/lightgbm -run '^$' \
              -bench '^BenchmarkCurrentModelPredict$' -benchtime=100x -benchmem \
              | tee SMART_MODEL_BENCH.txt

      - name: Link profile and power regressions
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./component/linkprofile ./component/netstate ./component/netchange -count=1
          CGO_ENABLED=0 go test ./adapter/provider -run 'TestHealthCheckParallelismPolicy' -count=1
          CGO_ENABLED=0 go test ./tunnel/statistic -count=1

      - name: MASQUE weak-network regression
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./adapter/outbound -run 'TestMasqueLoopRetryDelay' -count=1

      - name: Keepalive regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./component/keepalive -count=1
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go test -c ./component/keepalive -o /tmp/keepalive-android.test

      - name: DNS/executor regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./dns -count=1
          go test ./hub/executor -count=1

      - name: eBPF listener parser tests
        shell: bash
        run: |
          set -euo pipefail
          # Keep this gate scoped to eBPF. Running the entire listener/inbound
          # package also executes unrelated live VMess/V2Ray TLSMirror interop
          # tests, whose external timing can randomly fail after every Smart
          # and power regression has already passed.
          CGO_ENABLED=0 go test -tags "with_gvisor with_ebpf" ./listener/inbound -run '^TestEBPF' -count=1
          CGO_ENABLED=0 go test -tags "with_gvisor with_ebpf" ./listener/sing_ebpf -count=1

      - name: Build Linux parser self-test core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath               -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=se-test-$HEAD_SHORT' -w -s -buildid="               -o mihomo-boxproxy-ebpf-selftest

      - name: Parse exact BoxProxy listener fixture
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-boxproxy-ebpf-selftest             -t -f .github/fixtures/boxproxy-ebpf-listener.yaml             2>&1 | tee BOXPROXY_SCHEMA_SELFTEST.txt
          grep -qi "configuration file .* test is successful" BOXPROXY_SCHEMA_SELFTEST.txt

      - name: Parse custom IP-family directives
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-boxproxy-ebpf-selftest -t -f .github/fixtures/ip-family-routing.yaml 2>&1 | tee IP_FAMILY_SELFTEST.txt
          grep -qi "configuration file .* test is successful" IP_FAMILY_SELFTEST.txt

      - name: Parse mobile whole-core directives
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-boxproxy-ebpf-selftest -t -f .github/fixtures/mobile-core-opt.yaml 2>&1 | tee MOBILE_SELFTEST.txt
          grep -qi "configuration file .* test is successful" MOBILE_SELFTEST.txt

      - name: Verify documented BoxProxy keys are accepted
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type: ebpf' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'include-uid:' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'ipv6-mode:' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'network:' .github/fixtures/boxproxy-ebpf-listener.yaml
          grep -q 'case "ebpf":' listener/parse.go
          grep -q 'inbound:"include-uid,omitempty"' listener/config/ebpf.go
          grep -q 'inbound:"ipv6-mode,omitempty"' listener/config/ebpf.go

      - name: Validate Box for Root installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n tools/install-smart-v7-box.sh
          sh -n tools/install-smart-v8-box.sh
          sh -n tools/test-smart-v8-installer.sh
          sh tools/test-smart-v8-installer.sh
          grep -q 'database/box.db' tools/install-smart-v8-box.sh
          grep -q 'runtime_profile' tools/install-smart-v8-box.sh
          grep -q 'mihomo.smart-prev' tools/install-smart-v8-box.sh

      - name: Build Android arm64 core
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          strings "$OUT" | grep -q "github.com/metacubex/mihomo/component/smart"
          strings "$OUT" | grep -q "listener/sing_ebpf"
          strings "$OUT" | grep -q "api4.ipify.org"
          strings "$OUT" | grep -q "api6.ipify.org"
          strings "$OUT" | grep -q "country-affinity"
          gzip -9 -c "$OUT" > "$OUT.gz"

          # BoxProxy app has a local CoreImport flow and recognizes its Smart
          # Mihomo release asset naming convention. Ship the same validated
          # binary under that convention so users can install it from the app
          # without bypassing BoxProxy's runtime database/control plane.
          APP_CORE="mihomo-android-arm64-v8-alpha-smart-$HEAD_SHORT"
          cp "$OUT" "$APP_CORE"
          chmod 0755 "$APP_CORE"
          gzip -9 -c "$APP_CORE" > "$APP_CORE.gz"
          gzip -t "$APP_CORE.gz"
          cmp "$OUT" "$APP_CORE"
          gzip -dc "$APP_CORE.gz" | cmp - "$OUT"

          sha256sum "$OUT" "$OUT.gz" "$APP_CORE" "$APP_CORE.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "base=liuran001/mihomo:Alpha"
            echo "boxproxy_schema=listeners.type=ebpf"
            echo "target=android/arm64"
            echo "tags=with_gvisor with_ebpf"
            echo "cgo=0"
            echo "android_keepalive_default=idle60s,interval20s"
            echo "country_routing=MMDB reuse,no new database"
            echo "boxproxy_app_import=mihomo-android-arm64-v8-alpha-smart-$HEAD_SHORT.gz"
            echo "boxproxy_target_core=mihomo"
          } > BUILD_INFO.txt
          {
            echo "BoxProxy local core import"
            echo "target=mihomo"
            echo "raw=$APP_CORE"
            echo "archive=$APP_CORE.gz"
            echo "source=$HEAD_SHA"
            echo "note=Import with BoxProxy's local core installer; BoxProxy keeps runtime_profile and restarts through its own control plane."
          } > BOXPROXY_IMPORT_INFO.txt

      - name: Upload Android core
        uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-a64-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            mihomo-android-arm64-v8-alpha-smart-*
            SHA256SUMS
            BUILD_INFO.txt
            BOXPROXY_IMPORT_INFO.txt
            FILE_INFO.txt
            BOXPROXY_SCHEMA_SELFTEST.txt
            IP_FAMILY_SELFTEST.txt
            MOBILE_SELFTEST.txt
            SMART_BENCH.txt
            tools/install-smart-v7-box.sh
            tools/install-smart-v8-box.sh
            .github/fixtures/boxproxy-ebpf-listener.yaml
            .github/fixtures/ip-family-routing.yaml
            .github/fixtures/mobile-core-opt.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Android Smart eBPF prerelease
        if: github.ref == 'refs/heads/integration/boxproxy-native-ebpf'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="Smart-eBPF-Android"
          SRC="$(ls -1 mihomo-a64-smart-ebpf-*.gz | head -n 1)"
          STABLE="mihomo-android-arm64-smart-ebpf.gz"
          cp "$SRC" "$STABLE"
          sha256sum "$STABLE" > SHA256SUMS.release
          cp SHA256SUMS.release SHA256SUMS
          {
            echo
            echo "rolling_release_tag=$TAG"
            echo "rolling_release_asset=$STABLE"
          } >> BUILD_INFO.txt

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi

          gh release create "$TAG" \
            "$STABLE" \
            "SHA256SUMS" \
            "BUILD_INFO.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Smart eBPF Android (rolling)" \
            --notes "Rolling Android arm64 build from integration/boxproxy-native-ebpf. Source: $GITHUB_SHA. Validated by BoxProxy schema, Smart, IP-family, DNS and Android build gates." \
            --prerelease
