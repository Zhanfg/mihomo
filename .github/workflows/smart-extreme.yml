name: Smart Extreme

on:
  workflow_dispatch:
  push:
    branches:
      - opt/smart-expert-v8
      - opt/smart-production-v9
      - 'sync/**'
    paths:
      - ".github/workflows/smart-extreme.yml"
      - "adapter/outboundgroup/**"
      - "component/smart/**"
      - "component/linkprofile/**"
      - "component/netstate/**"
      - "cmd/smart-distill/**"
      - "tunnel/statistic/**"

permissions:
  contents: read

concurrency:
  group: smart-extreme-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  model-extreme:
    name: Million-case model adversarial
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify distilled production artifact
        run: go run ./cmd/smart-distill -verify

      - name: Run extreme reaction suite under memory pressure
        shell: bash
        env:
          SMART_EXTREME: "1"
          GOMEMLIMIT: "192MiB"
          GOMAXPROCS: "4"
        run: |
          set -euo pipefail
          /usr/bin/time -v go test ./component/smart -run '^TestSmartExtreme' -v -count=1 -timeout=20m 2>&1 | tee SMART_EXTREME.txt

      - name: Benchmark full experts, distillation and online student
        shell: bash
        env:
          GOMEMLIMIT: "192MiB"
          GOMAXPROCS: "4"
        run: |
          set -euo pipefail
          go test ./component/smart -run '^$' -bench 'Benchmark(ExpertTeacherPrior|DistilledExpertPrior|OnlineBanditPredict|OnlineBanditUpdate|ExplorationBonus)$' -benchtime=3s -benchmem | tee SMART_EXPERT_BENCH.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smart-model-extreme
          path: |
            SMART_EXTREME.txt
            SMART_EXPERT_BENCH.txt

  learner-race-soak:
    name: Learner race and repeated drift
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Race expert/student state
        shell: bash
        env:
          GOMAXPROCS: "4"
          GOMEMLIMIT: "256MiB"
        run: |
          set -euo pipefail
          go test -race ./component/smart ./adapter/outboundgroup -run 'Test(OnlineBandit|Distilled|Expert|GreedyExploration|ShouldInvokeTeacher|Student)' -count=10 -timeout=30m 2>&1 | tee SMART_RACE_SOAK.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smart-race-soak
          path: SMART_RACE_SOAK.txt

  core-chaos:
    name: 32K connection network chaos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build stress core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "-w -s -buildid=" -o mihomo-smart-extreme

      - name: Prepare changing network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smart-extreme/www
          printf 'smart-extreme\n' >/tmp/smart-extreme/www/index.html
          echo 0 >/tmp/smart-extreme/phase
          cat >/tmp/smart-extreme/harness.py <<'PY'
          import http.server, os, select, socket, socketserver, threading, time

          ROOT="/tmp/smart-extreme"
          counters={18101:0,18102:0,18103:0}
          lock=threading.Lock()

          def phase():
              try:
                  return int(open(ROOT+"/phase").read().strip())
              except Exception:
                  return 0

          def behavior(port):
              p=phase()
              table={
                  0:{18101:(0.002,0),18102:(0.030,0),18103:(0.080,7)},
                  1:{18101:(0.350,4),18102:(0.005,0),18103:(0.120,6)},
                  2:{18101:(0.010,0),18102:(0.250,5),18103:(0.060,3)},
                  3:{18101:(0.020,0),18102:(0.020,0),18103:(0.020,0)},
              }
              return table.get(p, table[0])[port]

          class Target(http.server.BaseHTTPRequestHandler):
              protocol_version="HTTP/1.1"
              def do_GET(self):
                  body=b"smart-extreme"
                  self.send_response(200)
                  self.send_header("Content-Length",str(len(body)))
                  self.send_header("Connection","close")
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self,*_): pass

          class TargetServer(http.server.ThreadingHTTPServer):
              daemon_threads=True
              request_queue_size=1024

          class Proxy(socketserver.BaseRequestHandler):
              def handle(self):
                  port=self.server.server_address[1]
                  with lock:
                      counters[port]+=1
                      n=counters[port]
                  delay,drop_every=behavior(port)
                  if delay:
                      time.sleep(delay)
                  if drop_every and n%drop_every==0:
                      return

                  client=self.request
                  client.settimeout(8)
                  data=b""
                  while b"\r\n\r\n" not in data and len(data)<65536:
                      chunk=client.recv(4096)
                      if not chunk: return
                      data+=chunk
                  first=data.split(b"\r\n",1)[0].decode("latin1","replace")
                  parts=first.split()
                  if len(parts)<2 or parts[0].upper()!="CONNECT":
                      client.sendall(b"HTTP/1.1 405 Method Not Allowed\r\nContent-Length:0\r\n\r\n")
                      return
                  hostport=parts[1]
                  host,port_s=hostport.rsplit(":",1)
                  host=host.strip("[]")
                  try:
                      upstream=socket.create_connection((host,int(port_s)),timeout=5)
                  except OSError:
                      return
                  client.sendall(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                  client.setblocking(False); upstream.setblocking(False)
                  sockets=[client,upstream]
                  try:
                      while True:
                          readable,_,exceptional=select.select(sockets,[],sockets,5)
                          if exceptional or not readable: break
                          for src in readable:
                              dst=upstream if src is client else client
                              try: buf=src.recv(65536)
                              except BlockingIOError: continue
                              if not buf: return
                              dst.sendall(buf)
                  finally:
                      upstream.close()

          class Threaded(socketserver.ThreadingMixIn,socketserver.TCPServer):
              daemon_threads=True
              allow_reuse_address=True
              request_queue_size=1024

          os.chdir(ROOT+"/www")
          target=TargetServer(("127.0.0.1",18080),Target)
          threading.Thread(target=target.serve_forever,daemon=True).start()
          servers=[]
          for port in (18101,18102,18103):
              srv=Threaded(("127.0.0.1",port),Proxy)
              servers.append(srv)
              threading.Thread(target=srv.serve_forever,daemon=True).start()
          while True: time.sleep(60)
          PY

          cat >/tmp/smart-extreme/config.yaml <<'YAML'
          mixed-port: 17890
          allow-lan: false
          mode: rule
          log-level: error
          ipv6: true
          find-process-mode: off
          profile:
            store-selected: false
            store-fake-ip: false
          proxies:
            - {name: FAST, type: http, server: 127.0.0.1, port: 18101}
            - {name: BACKUP, type: http, server: 127.0.0.1, port: 18102}
            - {name: FLAP, type: http, server: 127.0.0.1, port: 18103}
          proxy-groups:
            - name: SMART-EXTREME
              type: smart
              proxies: [FAST, BACKUP, FLAP]
              url: http://127.0.0.1:18080/
              interval: 1
              lazy: false
              uselightgbm: false
              auto-ip-family: true
              empty-fallback: REJECT
          rules:
            - MATCH,SMART-EXTREME
          YAML
          ./mihomo-smart-extreme -t -d /tmp/smart-extreme -f /tmp/smart-extreme/config.yaml

      - name: Run four-phase 32K chaos
        shell: bash
        env:
          GOMEMLIMIT: "192MiB"
          GOMAXPROCS: "4"
        run: |
          set -euo pipefail
          python3 /tmp/smart-extreme/harness.py >/tmp/harness.log 2>&1 &
          HARNESS_PID=$!
          ./mihomo-smart-extreme -d /tmp/smart-extreme -f /tmp/smart-extreme/config.yaml >/tmp/mihomo.log 2>&1 &
          CORE_PID=$!

          cleanup() { kill "$CORE_PID" "$HARNESS_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 3 -x http://127.0.0.1:17890 http://127.0.0.1:18080/ >/dev/null; then READY=1; break; fi
            kill -0 "$CORE_PID"
            sleep 0.1
          done
          test "$READY" -eq 1

          (
            while kill -0 "$CORE_PID" 2>/dev/null; do
              RSS=$(awk '/VmRSS:/{print $2}' /proc/$CORE_PID/status 2>/dev/null || echo 0)
              THR=$(awk '/Threads:/{print $2}' /proc/$CORE_PID/status 2>/dev/null || echo 0)
              CPU=$(ps -p "$CORE_PID" -o %cpu= 2>/dev/null | xargs || echo 0)
              echo "$(date +%s%3N) $RSS $THR $CPU"
              sleep 0.2
            done
          ) >RESOURCE_SAMPLES.txt &
          MON_PID=$!

          : >FAILURES.txt
          : >PHASE_RESULTS.txt
          for PHASE in 0 1 2 3; do
            echo "$PHASE" >/tmp/smart-extreme/phase
            sleep 2
            BEFORE=$(wc -l <FAILURES.txt)
            START=$(date +%s%3N)
            seq 1 8000 | xargs -P 128 -n 1 sh -c '
              curl -fsS --connect-timeout 2 --max-time 5 -x http://127.0.0.1:17890 http://127.0.0.1:18080/ >/dev/null 2>>CURL_ERRORS.txt || echo "$1" >>FAILURES.txt
            ' sh
            END=$(date +%s%3N)
            AFTER=$(wc -l <FAILURES.txt)
            echo "phase=$PHASE failures=$((AFTER-BEFORE)) elapsed_ms=$((END-START))" | tee -a PHASE_RESULTS.txt
            kill -0 "$CORE_PID"
          done

          kill "$MON_PID" 2>/dev/null || true
          wait "$MON_PID" 2>/dev/null || true

          awk 'BEGIN {rss=0;thr=0;cpu=0} {if($2>rss)rss=$2;if($3>thr)thr=$3;if($4>cpu)cpu=$4} END {printf "max_rss_kb=%d\nmax_threads=%d\nmax_cpu_percent=%.2f\n",rss,thr,cpu}' RESOURCE_SAMPLES.txt | tee RESOURCE_SUMMARY.txt

          FAILS=$(wc -l <FAILURES.txt)
          echo "requests=32000" | tee -a RESOURCE_SUMMARY.txt
          echo "parallelism=128" | tee -a RESOURCE_SUMMARY.txt
          echo "failures=$FAILS" | tee -a RESOURCE_SUMMARY.txt

          RSS=$(awk -F= '/max_rss_kb/{print $2}' RESOURCE_SUMMARY.txt)
          test "$FAILS" -le 320
          test "$RSS" -le 225000
          kill -0 "$CORE_PID"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smart-core-chaos
          path: |
            RESOURCE_SAMPLES.txt
            RESOURCE_SUMMARY.txt
            PHASE_RESULTS.txt
            FAILURES.txt
            CURL_ERRORS.txt
            /tmp/mihomo.log
            /tmp/harness.log
