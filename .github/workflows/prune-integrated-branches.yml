name: Prune Integrated Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-integrated-branches.yml
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete integrated branches (false = preview)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-integrated-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete only branches fully contained in main and unused by open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          APPLY_INPUT: ${{ inputs.apply }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_BASE: ${{ github.event.pull_request.base.ref || '' }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The merged pull request can be squash/rebase merged, so matching
            # commit ancestry of the source branch is not required.
            if [[ "$PR_MERGED" != "true" || "$PR_HEAD_REPO" != "$GH_REPO" ||
                  "$PR_BASE" != "main" || -z "$PR_MERGE_SHA" ||
                  "$PR_HEAD" == "main" || "$PR_HEAD" == "Alpha" ||
                  "$PR_HEAD" == "Meta" ]]; then
              echo "SKIP: not an eligible merged same-repository PR"
              exit 0
            fi
            head_sha=$(gh api "repos/$GH_REPO/branches/$PR_HEAD" --jq '.commit.sha' 2>/dev/null || true)
            protected=$(gh api "repos/$GH_REPO/branches/$PR_HEAD" --jq '.protected' 2>/dev/null || true)
            if [[ "$head_sha" != "$PR_HEAD_SHA" || "$protected" != "false" ]]; then
              echo "SKIP: branch head changed or protected"
              exit 0
            fi
            # Compare merge result against main, never trust the event alone.
            behind=$(gh api "repos/$GH_REPO/compare/$PR_MERGE_SHA...main" --jq '.behind_by' 2>/dev/null || true)
            if [[ "$behind" != "0" ]]; then
              echo "SKIP: merged commit not in main"
              exit 0
            fi
            gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
              --jq '.[] | .head.ref, .base.ref' | sort -u > /tmp/pr-refs.txt
            if grep -Fxq -- "$PR_HEAD" /tmp/pr-refs.txt; then
              echo "SKIP: branch still used by an open PR"
              exit 0
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$PR_HEAD" >/dev/null
            echo "DELETED $PR_HEAD: merged PR with verified exact head SHA"
            exit 0
          fi
          # Only the curated historical refs below can be pruned.
          # Keep main, Alpha, Meta, Mitm, memory and all active/diverged work.
          candidates=(
            "archive/main-pre-smart-v9-20261007"
            "backup/alpha-20260815"
            "debug/smart-latest-control"
            "debug/smart-old-control"
            "opt/smart-greedy-v3"
            "opt/smart-greedy-v4"
            "opt/smart-learning-v5"
            "opt/smart-link-v2"
            "opt/smart-runtime-v6"
            "opt/smart-production-v9"
            "sync/upstream-smart-20261006-longflow"
            "fix/smart-healthcheck-storm-20261013"
          )
          gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | .head.ref, .base.ref' | sort -u > /tmp/pr-refs.txt
          apply=false
          if [[ "$EVENT_NAME" == "push" || "$APPLY_INPUT" == "true" ]]; then
            apply=true
          fi
          deleted=0
          skipped=0
          failed=0
          for branch in "${candidates[@]}"; do
            if grep -Fxq -- "$branch" /tmp/pr-refs.txt; then
              echo "SKIP $branch: referenced by open PR"
              ((skipped+=1))
              continue
            fi
            # Missing/renamed branch? No action.
            protected=$(gh api "repos/$GH_REPO/branches/$branch" --jq '.protected' 2>/dev/null) || {
              echo "SKIP $branch: missing or inaccessible"
              ((skipped+=1))
              continue
            }
            if [[ "$protected" == "true" ]]; then
              echo "SKIP $branch: protected"
              ((skipped+=1))
              continue
            fi
            ahead=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by' 2>/dev/null) || {
              echo "SKIP $branch: cannot prove ancestry"
              ((skipped+=1))
              continue
            }
            if [[ "$ahead" != "0" ]]; then
              echo "SKIP $branch: $ahead commits not in main"
              ((skipped+=1))
              continue
            fi
            if [[ "$apply" != "true" ]]; then
              echo "PREVIEW $branch: safe to delete"
              ((skipped+=1))
              continue
            fi
            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
              echo "DELETED $branch"
              ((deleted+=1))
            else
              echo "ERROR $branch: deletion rejected by GitHub" >&2
              ((failed+=1))
            fi
          done
          # A squash-merged PR cannot be proven fully merged by Git ancestry.
          # Delete only the exact PR #14 head that GitHub marks merged, and
          # only after the squash result has reached main. Later commits are safe.
          pr_head=$(gh api "repos/$GH_REPO/pulls/14" --jq '.head.sha')
          pr_merge=$(gh api "repos/$GH_REPO/pulls/14" --jq '.merge_commit_sha')
          pr_merged=$(gh api "repos/$GH_REPO/pulls/14" --jq '.merged')
          branch="fix/smart-healthcheck-storm-20261013"
          live_head=$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)
          merge_in_main=$(gh api "repos/$GH_REPO/compare/$pr_merge...main" --jq '.behind_by' 2>/dev/null || true)
          if [[ "$pr_merged" == "true" && -n "$live_head" && "$pr_head" == "$live_head" && "$merge_in_main" == "0" ]]; then
            if [[ "$apply" == "true" ]]; then
              if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
                echo "DELETED $branch: verified squash-merged PR #14"
                ((deleted+=1))
              else
                echo "ERROR $branch: deletion rejected" >&2
                ((failed+=1))
              fi
            else
              echo "PREVIEW $branch: verified squash-merged PR #14"
            fi
          fi
          # Pilot the recoverable archival path for one obsolete debug branch.
          # Direct Git transport is verified with ls-remote before deletion.
          pilot="debug/smart-core-bisect"
          if [[ "$apply" == "true" ]] && ! grep -Fxq -- "$pilot" /tmp/pr-refs.txt; then
            head=$(gh api "repos/$GH_REPO/branches/$pilot" --jq '.commit.sha' 2>/dev/null || true)
            protected=$(gh api "repos/$GH_REPO/branches/$pilot" --jq '.protected' 2>/dev/null || true)
            if [[ -n "$head" && "$protected" == "false" ]]; then
              tag="branch-archive/2026-10-14/$pilot"
              saved=$(git ls-remote origin "refs/tags/$tag" | awk 'NR==1 {print $1}')
              if [[ -z "$saved" ]]; then
                git fetch --no-tags origin "refs/heads/$pilot:refs/remotes/origin/$pilot"
                git tag "$tag" "$head"
                git push origin "refs/tags/$tag"
                saved=$(git ls-remote origin "refs/tags/$tag" | awk 'NR==1 {print $1}')
              fi
              current=$(gh api "repos/$GH_REPO/branches/$pilot" --jq '.commit.sha' 2>/dev/null || true)
              if [[ "$saved" == "$head" && "$current" == "$head" ]]; then
                git push origin --delete "$pilot"
                echo "ARCHIVED $pilot => $tag @ $head"
                ((deleted+=1))
              else
                echo "PRESERVE $pilot: remote archive ref could not be verified"
              fi
            fi
          fi
          echo "deleted=$deleted skipped=$skipped failed=$failed"
          {
            echo "### Curated integrated branch cleanup"
            echo "Applied: $apply"
            echo "Deleted: $deleted"
            echo "Skipped: $skipped"
            echo "Failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$failed" == "0" ]]
