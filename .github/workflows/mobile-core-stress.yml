name: Mobile Core Stress

on:
  workflow_dispatch:
  push:
    branches:
      - integration/boxproxy-native-ebpf
      - opt/smart-link-v2
      - opt/smart-greedy-v3
      - opt/smart-greedy-v4
      - opt/smart-learning-v5
      - opt/smart-runtime-v6
      - opt/smart-model-v7
      - opt/smart-box-v8
    paths:
      - ".github/workflows/mobile-core-stress.yml"
      - ".github/scripts/smart_extreme_soak.py"
      - "adapter/**"
      - "component/smart/**"
      - "component/linkprofile/**"
      - "component/netstate/**"
      - "component/netchange/**"
      - "component/mmdb/**"
      - "component/keepalive/**"
      - "dns/**"
      - "listener/sing_ebpf/**"
      - "common/ebpf/**"
      - "tunnel/statistic/**"

permissions:
  contents: read

concurrency:
  group: mobile-core-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: Race / Smart / DNS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./adapter ./adapter/outboundgroup ./adapter/provider ./component/smart ./component/linkprofile ./component/netstate ./component/netchange ./dns ./component/keepalive ./tunnel/statistic             -count=1 -timeout=25m 2>&1 | tee RACE.txt

      - name: Upload race report
        uses: actions/upload-artifact@v7
        with:
          name: stress-race
          path: RACE.txt

  repeat:
    name: Repeated Smart / eBPF regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Smart and DNS repeated stress
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v go test ./adapter ./adapter/outboundgroup ./adapter/provider ./component/smart ./component/linkprofile ./component/netstate ./component/netchange ./dns ./tunnel/statistic             -count=20 -timeout=30m 2>&1 | tee REPEAT_SMART_DNS.txt

      - name: eBPF repeated stress
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v go test -tags "with_gvisor with_ebpf"             ./listener/sing_ebpf ./common/ebpf             -count=5 -timeout=30m 2>&1 | tee REPEAT_EBPF.txt

      - name: Hot-path benchmarks
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== Smart benchmarks ==="
            go test ./component/smart -run '^$' -bench '.' -benchmem -benchtime=2s || true
            echo "=== eBPF benchmarks ==="
            go test -tags "with_gvisor with_ebpf" ./listener/sing_ebpf               -run '^$' -bench '.' -benchmem -benchtime=2s || true
          } | tee BENCH.txt

      - name: Upload repeat reports
        uses: actions/upload-artifact@v7
        with:
          name: stress-repeat
          path: |
            REPEAT_SMART_DNS.txt
            REPEAT_EBPF.txt
            BENCH.txt

  churn:
    name: 8000-connection mixed-port churn
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build Linux stress core
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHORT="$(git rev-parse --short=7 HEAD)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath               -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=stress-$HEAD_SHORT' -w -s -buildid="               -o mihomo-stress

      - name: Prepare local stress config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mihomo-stress/www
          printf 'ok\n' > /tmp/mihomo-stress/www/index.html
          cat > /tmp/mihomo-stress/server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import os

          class StressServer(ThreadingHTTPServer):
              request_queue_size = 512
              daemon_threads = True

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

          os.chdir("/tmp/mihomo-stress/www")
          StressServer(("127.0.0.1", 18080), QuietHandler).serve_forever()
          PY
          cat > /tmp/mihomo-stress/config.yaml <<'YAML'
          mixed-port: 17890
          allow-lan: false
          mode: rule
          log-level: error
          ipv6: true
          find-process-mode: off
          profile:
            store-selected: false
            store-fake-ip: false
          proxy-groups:
            - name: STRESS
              type: smart
              proxies: [DIRECT]
              url: http://127.0.0.1:18080/
              interval: 60
              lazy: false
              uselightgbm: false
              auto-ip-family: true
              country-affinity: true
              empty-fallback: REJECT
          rules:
            - MATCH,STRESS
          YAML
          ./mihomo-stress -t -d /tmp/mihomo-stress -f /tmp/mihomo-stress/config.yaml

      - name: Run high-concurrency connection churn
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/mihomo-stress/server.py >/tmp/http.log 2>&1 &
          HTTP_PID=$!

          ./mihomo-stress -d /tmp/mihomo-stress -f /tmp/mihomo-stress/config.yaml             >/tmp/mihomo.log 2>&1 &
          MIHOMO_PID=$!

          cleanup() {
            kill "$MIHOMO_PID" "$HTTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 100); do
            if curl -fsS --max-time 2 -x http://127.0.0.1:17890               http://127.0.0.1:18080/ >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$MIHOMO_PID" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$READY" -ne 1 ]; then
            echo "mihomo did not become ready" >&2
            echo "--- mihomo.log ---" >&2
            cat /tmp/mihomo.log >&2 || true
            echo "--- http.log ---" >&2
            cat /tmp/http.log >&2 || true
            exit 1
          fi

          (
            while kill -0 "$MIHOMO_PID" 2>/dev/null; do
              TS=$(date +%s%3N)
              RSS=$(awk '/VmRSS:/{print $2}' /proc/$MIHOMO_PID/status 2>/dev/null || echo 0)
              THR=$(awk '/Threads:/{print $2}' /proc/$MIHOMO_PID/status 2>/dev/null || echo 0)
              CPU=$(ps -p "$MIHOMO_PID" -o %cpu= 2>/dev/null | xargs || echo 0)
              echo "$TS $RSS $THR $CPU"
              sleep 0.2
            done
          ) > RESOURCE_SAMPLES.txt &
          MON_PID=$!

          /usr/bin/time -v python3 .github/scripts/smart_extreme_soak.py \
            --count 8000 --concurrency 48 --timeout 4 --label churn \
            > CHURN.json 2> LOAD_TIME.txt

          sleep 2
          kill "$MON_PID" 2>/dev/null || true
          wait "$MON_PID" 2>/dev/null || true

          kill -0 "$MIHOMO_PID"
          curl -fsS --max-time 3 -x http://127.0.0.1:17890             http://127.0.0.1:18080/ >/dev/null

          awk '
            BEGIN { maxrss=0; maxthr=0; maxcpu=0 }
            {
              if ($2+0 > maxrss) maxrss=$2+0
              if ($3+0 > maxthr) maxthr=$3+0
              if ($4+0 > maxcpu) maxcpu=$4+0
            }
            END {
              printf "max_core_rss_kb=%d\nmax_core_threads=%d\nmax_core_cpu_percent=%.2f\n",
                maxrss,maxthr,maxcpu
            }
          ' RESOURCE_SAMPLES.txt | tee RESOURCE_SUMMARY.txt

          FAIL_COUNT="$(python3 - <<'PY'
          import json
          print(json.load(open("CHURN.json"))["failures"])
          PY
          )"
          echo "requests=8000" | tee -a RESOURCE_SUMMARY.txt
          echo "parallelism=48" | tee -a RESOURCE_SUMMARY.txt
          echo "request_failures=$FAIL_COUNT" | tee -a RESOURCE_SUMMARY.txt
          echo "core_alive_after_load=YES" | tee -a RESOURCE_SUMMARY.txt
          cat CHURN.json | tee -a RESOURCE_SUMMARY.txt
          tail -n 240 /tmp/mihomo.log > MIHOMO_TAIL.txt
          test "$FAIL_COUNT" -eq 0

      - name: Upload churn reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-churn
          path: |
            RESOURCE_SAMPLES.txt
            RESOURCE_SUMMARY.txt
            LOAD_TIME.txt
            MIHOMO_TAIL.txt
            CHURN.json
            /tmp/mihomo.log
            /tmp/http.log


  smart-extreme:
    name: Smart extreme model / distill / drift
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run adversarial model extreme suite
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v go test -tags smart_extreme ./component/smart -run '^TestSmartExtreme' -count=1 -timeout=25m 2>&1 | tee SMART_EXTREME.txt

      - name: Race concurrent distillation
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags smart_extreme ./component/smart -run '^TestSmartExtremeConcurrentExpertDistillAndSnapshot$' -count=1 -timeout=20m 2>&1 | tee SMART_EXTREME_RACE.txt

      - name: Benchmark online model stack
        shell: bash
        run: |
          set -euo pipefail
          go test ./component/smart -run '^$' -bench 'Benchmark(DistilledExpert|OnlineBandit|ExplorationBonus)' -benchmem -benchtime=5s | tee SMART_MODEL_STACK_BENCH.txt

      - name: Enforce extreme-suite memory budget
        shell: bash
        run: |
          set -euo pipefail
          RSS="$(awk -F: '/Maximum resident set size \(kbytes\)/{gsub(/ /,"",$2); print $2}' SMART_EXTREME.txt | tail -n1)"
          test -n "$RSS"
          echo "extreme_test_max_rss_kb=$RSS" | tee SMART_EXTREME_SUMMARY.txt
          test "$RSS" -lt 786432

      - name: Upload extreme model reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-extreme-model
          path: |
            SMART_EXTREME.txt
            SMART_EXTREME_RACE.txt
            SMART_MODEL_STACK_BENCH.txt
            SMART_EXTREME_SUMMARY.txt

  adversarial-soak:
    name: 47000-request failure / recovery soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build soak core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -o mihomo-soak

      - name: Prepare soak fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mihomo-soak/www
          printf 'smart-soak-ok\n' > /tmp/mihomo-soak/www/index.html
          cat > /tmp/mihomo-soak/server.py <<'PY'
          import asyncio

          BODY = b"smart-soak-ok\n"
          RESPONSE = (
              b"HTTP/1.1 200 OK\r\n"
              b"Content-Type: text/plain\r\n"
              b"Content-Length: " + str(len(BODY)).encode() + b"\r\n"
              b"Connection: close\r\n\r\n" + BODY
          )

          async def handle(reader, writer):
              try:
                  await asyncio.wait_for(reader.readuntil(b"\r\n\r\n"), timeout=5)
                  writer.write(RESPONSE)
                  await writer.drain()
              except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, TimeoutError):
                  pass
              finally:
                  writer.close()
                  try:
                      await writer.wait_closed()
                  except Exception:
                      pass

          async def main():
              server = await asyncio.start_server(handle, "127.0.0.1", 18080, backlog=4096)
              async with server:
                  await server.serve_forever()

          asyncio.run(main())
          PY
          cat > /tmp/mihomo-soak/config.yaml <<'YAML'
          mixed-port: 17890
          allow-lan: false
          mode: rule
          log-level: error
          ipv6: true
          find-process-mode: off
          profile:
            store-selected: false
            store-fake-ip: false
          proxy-groups:
            - name: STRESS
              type: smart
              proxies: [DIRECT]
              url: http://127.0.0.1:18080/
              interval: 60
              lazy: false
              uselightgbm: false
              auto-ip-family: true
              max-failed-times: 100000
              empty-fallback: REJECT
          rules:
            - MATCH,STRESS
          YAML
          ./mihomo-soak -t -d /tmp/mihomo-soak -f /tmp/mihomo-soak/config.yaml

      - name: Run healthy-failure-recovery waves
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/mihomo-soak/server.py >/tmp/soak-http.log 2>&1 &
          HTTP_PID=$!
          ./mihomo-soak -d /tmp/mihomo-soak -f /tmp/mihomo-soak/config.yaml >/tmp/soak-mihomo.log 2>&1 &
          MIHOMO_PID=$!

          cleanup() {
            kill "$MIHOMO_PID" "$HTTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 150); do
            if python3 .github/scripts/smart_extreme_soak.py --count 1 --concurrency 1 --timeout 1 --label ready >/tmp/ready.json 2>/dev/null; then
              if grep -q '"failures":0' /tmp/ready.json; then break; fi
            fi
            kill -0 "$MIHOMO_PID"
            sleep 0.1
          done
          grep -q '"failures":0' /tmp/ready.json

          (
            while kill -0 "$MIHOMO_PID" 2>/dev/null; do
              TS=$(date +%s%3N)
              RSS=$(awk '/VmRSS:/{print $2}' /proc/$MIHOMO_PID/status 2>/dev/null || echo 0)
              THR=$(awk '/Threads:/{print $2}' /proc/$MIHOMO_PID/status 2>/dev/null || echo 0)
              CPU=$(ps -p "$MIHOMO_PID" -o %cpu= 2>/dev/null | xargs || echo 0)
              echo "$TS $RSS $THR $CPU"
              sleep 0.2
            done
          ) > SOAK_RESOURCE_SAMPLES.txt &
          MON_PID=$!

          python3 .github/scripts/smart_extreme_soak.py --count 30000 --concurrency 128 --timeout 4 --label healthy > SOAK_HEALTHY.json

          kill "$HTTP_PID"
          wait "$HTTP_PID" 2>/dev/null || true
          python3 .github/scripts/smart_extreme_soak.py --count 2000 --concurrency 128 --timeout 1.5 --label outage > SOAK_OUTAGE.json || true
          kill -0 "$MIHOMO_PID"

          python3 /tmp/mihomo-soak/server.py >>/tmp/soak-http.log 2>&1 &
          HTTP_PID=$!
          RECOVERED=0
          STABLE_WAVES=0
          RECOVERY_ROUNDS=0
          for round in $(seq 1 150); do
            RECOVERY_ROUNDS="$round"
            python3 .github/scripts/smart_extreme_soak.py --count 32 --concurrency 8 --timeout 2 --label recovery-probe >/tmp/recovery-probe.json || true
            if grep -q '"failures":0' /tmp/recovery-probe.json; then
              STABLE_WAVES=$((STABLE_WAVES + 1))
              if [ "$STABLE_WAVES" -ge 3 ]; then
                RECOVERED=1
                break
              fi
            else
              STABLE_WAVES=0
            fi
            kill -0 "$MIHOMO_PID"
            sleep 0.2
          done
          test "$RECOVERED" -eq 1
          echo "recovery_probe_rounds=$RECOVERY_ROUNDS" > SOAK_RECOVERY_SUMMARY.txt

          python3 .github/scripts/smart_extreme_soak.py --count 30000 --concurrency 128 --timeout 4 --label recovered > SOAK_RECOVERED.json

          kill "$MON_PID" 2>/dev/null || true
          wait "$MON_PID" 2>/dev/null || true
          kill -0 "$MIHOMO_PID"

          python3 - <<'PY'
          import json
          h=json.load(open("SOAK_HEALTHY.json"))
          o=json.load(open("SOAK_OUTAGE.json"))
          r=json.load(open("SOAK_RECOVERED.json"))
          assert h["failure_rate"] <= 0.002, h
          assert o["failure_rate"] >= 0.80, o
          assert r["failure_rate"] <= 0.002, r
          assert r["failure_rate"] <= h["failure_rate"] + 0.001, (h, r)
          assert r["latency_ms"]["p99"] <= max(250.0, h["latency_ms"]["p99"] * 2.0), (h, r)
          print("healthy_failure_rate=%.6f" % h["failure_rate"])
          print("outage_failure_rate=%.6f" % o["failure_rate"])
          print("recovered_failure_rate=%.6f" % r["failure_rate"])
          print("healthy_p99_ms=%.2f" % h["latency_ms"]["p99"])
          print("recovered_p99_ms=%.2f" % r["latency_ms"]["p99"])
          PY

          awk '
            BEGIN { maxrss=0; maxthr=0; maxcpu=0 }
            {
              if ($2+0 > maxrss) maxrss=$2+0
              if ($3+0 > maxthr) maxthr=$3+0
              if ($4+0 > maxcpu) maxcpu=$4+0
            }
            END {
              printf "max_core_rss_kb=%d\nmax_core_threads=%d\nmax_core_cpu_percent=%.2f\n", maxrss,maxthr,maxcpu
              if (maxrss >= 196608) exit 2
              if (maxthr >= 96) exit 3
            }
          ' SOAK_RESOURCE_SAMPLES.txt | tee SOAK_RESOURCE_SUMMARY.txt
          tail -n 300 /tmp/soak-mihomo.log > SOAK_MIHOMO_TAIL.txt

      - name: Upload adversarial soak reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-adversarial-soak
          path: |
            SOAK_HEALTHY.json
            SOAK_OUTAGE.json
            SOAK_RECOVERED.json
            SOAK_RESOURCE_SAMPLES.txt
            SOAK_RESOURCE_SUMMARY.txt
            SOAK_RECOVERY_SUMMARY.txt
            SOAK_MIHOMO_TAIL.txt
            /tmp/recovery-probe.json
            /tmp/soak-mihomo.log
            /tmp/soak-http.log
