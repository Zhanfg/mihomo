name: Mobile Runtime Stall Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-runtime-stall
    paths:
      - "adapter/outboundgroup/smart.go"
      - "adapter/outboundgroup/smart_runtime_stability_test.go"
      - ".github/workflows/boxproxy-native-ebpf-android.yml"
      - ".github/workflows/boxproxy-native-ebpf-fast.yml"
      - ".github/workflows/mobile-runtime-stall.yml"

permissions:
  contents: read

concurrency:
  group: mobile-runtime-stall
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Source identity
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=$HEAD_SHORT" >> "$GITHUB_ENV"

      - name: gofmt gate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d adapter/outboundgroup/smart.go adapter/outboundgroup/smart_runtime_stability_test.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff

      - name: Focused runtime-stall tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter/outboundgroup -run 'TestSmartStats(QueueSaturationDoesNotBlock|WorkerRecoversTelemetryPanic)' -count=50

      - name: Race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./adapter/outboundgroup ./component/smart ./component/keepalive -count=1 -timeout=20m

      - name: Repeated Smart regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter/outboundgroup ./component/smart ./dns -count=10 -timeout=20m

      - name: Build Android arm64 full compatibility core
        shell: bash
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          strings "$OUT" | grep -q "github.com/metacubex/mihomo/component/smart"
          strings "$OUT" | grep -q "listener/sing_ebpf"
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "tags=with_gvisor with_ebpf"
            echo "telemetry_queue=nonblocking"
            echo "telemetry_panic_isolation=enabled"
            echo "android_stats_queue=256"
          } > BUILD_INFO.txt

      - uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-a64-stallfix-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            FILE_INFO.txt
          if-no-files-found: error
          retention-days: 30
