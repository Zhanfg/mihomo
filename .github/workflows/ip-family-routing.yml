name: IP Family Routing Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ip-family-routing
    paths:
      - "adapter/capability.go"
      - "adapter/capability_tier_test.go"
      - "adapter/outboundgroup/**"
      - ".github/fixtures/ip-family-routing.yaml"
      - ".github/workflows/ip-family-routing.yml"

permissions:
  contents: read

concurrency:
  group: ip-family-routing
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Source identity
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=$HEAD_SHORT" >> "$GITHUB_ENV"
          go version
          git log -1 --oneline

      - name: gofmt gate
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            adapter/capability.go
            adapter/capability_tier_test.go
            adapter/outboundgroup/urltest.go
            adapter/outboundgroup/smart.go
            adapter/outboundgroup/capability_test.go
          )
          gofmt -d "${FILES[@]}" | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff

      - name: Capability unit tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter -run 'Test(IPv4|IPv6|IPFamily|Capability|AddCapability)' -count=1

      - name: Outbound group unit tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter/outboundgroup -run 'Test(CustomIPFamily|RequireCapability|URLTest|Smart)' -count=1

      - name: Full adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter/... -count=1

      - name: Build Linux parser core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath               -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-ebpf-$HEAD_SHORT' -w -s -buildid="               -o mihomo-selftest

      - name: Parse custom directive fixture
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-selftest -t -f .github/fixtures/ip-family-routing.yaml 2>&1 | tee IP_FAMILY_SELFTEST.txt
          grep -qi "configuration file .* test is successful" IP_FAMILY_SELFTEST.txt

      - name: Build Android arm64
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          file "$OUT" | tee FILE_INFO.txt
          strings "$OUT" | grep -q "api4.ipify.org"
          strings "$OUT" | grep -q "api6.ipify.org"
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "custom_directives=prefer-ipv4,prefer-ipv6,require-ipv4,require-ipv6,auto-ip-family"
            echo "target=android/arm64"
            echo "tags=with_gvisor with_ebpf"
          } > BUILD_INFO.txt

      - uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-a64-ipfamily-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            FILE_INFO.txt
            IP_FAMILY_SELFTEST.txt
            .github/fixtures/ip-family-routing.yaml
          if-no-files-found: error
          retention-days: 30
