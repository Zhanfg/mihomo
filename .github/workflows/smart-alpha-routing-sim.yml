name: Smart Alpha Comprehensive Validation

on:
  workflow_dispatch:
  push:
    branches:
      - test/smart-alpha-routing-sim
    paths:
      - ".github/workflows/smart-alpha-routing-sim.yml"
      - ".github/scripts/smart-routing-sim.sh"
      - ".github/scripts/smart-profile-regression.sh"
      - ".github/scripts/smart-ebpf-routing-smoke.sh"
      - ".github/scripts/smart-accelerated-day-soak.sh"
      - ".github/scripts/smart-accelerated-week-soak.sh"
      - "adapter/**"
      - "component/**"
      - "config/**"
      - "dns/**"
      - "listener/**"
      - "rules/**"
      - "tunnel/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: smart-alpha-comprehensive-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_CONCURRENT_TEST: "1"
  SKIP_INTEROP_TEST: "1"

jobs:
  smart-unit:
    name: Upstream baseline / Smart unit / race / full regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify branch contains current Vernesong Alpha
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/vernesong/mihomo.git \
            Alpha:refs/remotes/smart-upstream/Alpha
          echo "test_head=$(git rev-parse HEAD)"
          echo "smart_alpha=$(git rev-parse refs/remotes/smart-upstream/Alpha)"
          git merge-base --is-ancestor refs/remotes/smart-upstream/Alpha HEAD

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Prepare CA bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Smart-focused unit tests
        run: |
          go test -count=1 \
            ./adapter/outboundgroup \
            ./component/smart/... \
            ./component/dialer \
            ./dns/...

      - name: Race detector on Smart state/concurrency paths
        run: |
          go test -race -count=1 \
            ./adapter/outboundgroup \
            ./component/smart/...

      - name: Full repository regression
        run: go test -count=1 ./...

      - name: Linux build smoke test
        run: |
          go build -v -buildvcs=false -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-alpha-ci-${GITHUB_SHA::7}' -w -s -buildid=" \
            -o mihomo-linux-amd64

      - name: Binary/config parser smoke
        run: |
          ./mihomo-linux-amd64 -v
          ./mihomo-linux-amd64 -h >/dev/null


  profile-regression:
    name: Production-shaped config / 8 Smart groups / fake-IP / rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smart-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install config-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl dnsutils jq
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build profile-test core
        run: |
          go build -v -buildvcs=false -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-profile-${GITHUB_SHA::7}' -w -s -buildid=" \
            -o mihomo-profile-test

      - name: Run production-shaped config regression
        run: |
          chmod +x .github/scripts/smart-profile-regression.sh
          .github/scripts/smart-profile-regression.sh

      - name: Upload profile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-profile-diagnostics-${{ github.run_id }}
          path: |
            .profile-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  routing-simulation:
    name: TProxy matrix (${{ matrix.netfilter }}) / failover / v4+v6 / TCP+UDP / stress
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: smart-unit
    strategy:
      fail-fast: false
      matrix:
        netfilter: [nft, legacy]

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install routing test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            dnsutils \
            iproute2 \
            iptables \
            jq \
            kmod \
            nftables \
            python3
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Select netfilter backend
        run: |
          sudo update-alternatives --set iptables /usr/sbin/iptables-${{ matrix.netfilter }}
          sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-${{ matrix.netfilter }}
          iptables --version
          ip6tables --version

      - name: Build Linux Smart Alpha test core
        env:
          CGO_ENABLED: "1"
        run: |
          go build -v -buildvcs=false -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-alpha-routing-${GITHUB_SHA::7}' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid=" \
            -o mihomo-routing-test

      - name: Run routed network-namespace simulation
        run: |
          chmod +x .github/scripts/smart-routing-sim.sh
          .github/scripts/smart-routing-sim.sh

      - name: Upload route diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-alpha-routing-${{ matrix.netfilter }}-diagnostics-${{ github.run_id }}
          path: |
            .route-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14


  accelerated-day-soak:
    name: Accelerated 24h soak (${{ matrix.netfilter }}) / stress / churn / leak gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smart-unit
    strategy:
      fail-fast: false
      matrix:
        netfilter: [nft, legacy]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install soak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl dnsutils iproute2 iptables jq kmod nftables python3
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Select netfilter backend
        run: |
          sudo update-alternatives --set iptables /usr/sbin/iptables-${{ matrix.netfilter }}
          sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-${{ matrix.netfilter }}
          iptables --version
          ip6tables --version

      - name: Build soak-test core
        env:
          CGO_ENABLED: "1"
        run: |
          go build -v -buildvcs=false -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-alpha-soak-${GITHUB_SHA::7}' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid=" \
            -o mihomo-soak-test

      - name: Run 1-minute virtual-day soak and pressure suite
        run: |
          chmod +x .github/scripts/smart-accelerated-day-soak.sh
          .github/scripts/smart-accelerated-day-soak.sh

      - name: Publish soak summary
        if: always()
        run: |
          if [[ -f .soak-artifacts/summary.txt ]]; then
            echo "### Accelerated 24h soak (${{ matrix.netfilter }})" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' .soak-artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload soak diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-accelerated-day-${{ matrix.netfilter }}-${{ github.run_id }}
          path: |
            .soak-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14


  accelerated-week-soak:
    name: Accelerated 7d aging (${{ matrix.netfilter }}) / provider / cache / history / reclaim
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: smart-unit
    strategy:
      fail-fast: false
      matrix:
        netfilter: [nft, legacy]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install aging-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl dnsutils iproute2 iptables jq kmod nftables python3
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Select netfilter backend
        run: |
          sudo update-alternatives --set iptables /usr/sbin/iptables-${{ matrix.netfilter }}
          sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-${{ matrix.netfilter }}
          iptables --version
          ip6tables --version

      - name: Build seven-day aging core
        env:
          CGO_ENABLED: "1"
        run: |
          go build -v -buildvcs=false -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-alpha-week-${GITHUB_SHA::7}' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid=" \
            -o mihomo-week-soak-test

      - name: Run compressed seven-day aging suite
        run: |
          chmod +x .github/scripts/smart-accelerated-week-soak.sh
          .github/scripts/smart-accelerated-week-soak.sh

      - name: Publish seven-day summary
        if: always()
        run: |
          if [[ -f .week-soak-artifacts/summary.txt ]]; then
            echo "### Accelerated 7d aging (${{ matrix.netfilter }})" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' .week-soak-artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload seven-day diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-accelerated-week-${{ matrix.netfilter }}-${{ github.run_id }}
          path: |
            .week-soak-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14


  ebpf-forward-compat:
    name: Latest Alpha + existing Android eBPF patch compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: smart-unit

    steps:
      - name: Checkout with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch existing eBPF development branch
        run: git fetch origin feature/android-ebpf-routing:refs/remotes/origin/feature/android-ebpf-routing

      - name: Apply eBPF patch stack onto latest Alpha
        run: |
          set -euo pipefail
          git config user.name "Smart CI"
          git config user.email "smart-ci@users.noreply.github.com"
          PATCHES=(
            a2a6b2f6bc9dd7a1bf00ffd275c92202e001bb8f
            47d088f34775ff8733e839372c135d235d7fac72
            1e145e4fc75f04d2a6e67d2406819edc37a01de1
            01c43bf02c8a42be7891c50cc8509279337f4032
            ef06639bc8af6cd721c9f93cc0f0f70b986c951e
            c967e100385d29980a2158cd777405d2ac71a296
            938c1cc5c06115dd6cd67a5143bab03c47606161
            b22228b1967035449de8dd0059918f708d08caf8
            45767839f0a785822cf91b060f1322c4c5acc106
            33fb54474043a22dcc73ae28678fffe69ac62632
            6c3591ecbd096287ae970679074ea9fd8ca09c9a
            4f88f5a5eafe6d304ab8e7c2c8dcb050e5cdfc9d
          )
          for sha in "${PATCHES[@]}"; do
            echo "Applying $sha"
            if ! git cherry-pick "$sha"; then
              git status --short
              git diff --cc || true
              exit 1
            fi
          done
          git log --oneline -15 > ebpf-applied-commits.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Prepare CA bundle and modules
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl iproute2 iptables jq python3
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt
          go mod tidy

      - name: Linux eBPF + Smart tests
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go test -count=1 -tags "with_ebpf" \
              ./listener/ebpf \
              ./component/dialer \
              ./config \
              ./adapter/outboundgroup

      - name: Build Linux eBPF runtime core
        run: |
          CGO_ENABLED=0 go build -v -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-alpha-ebpf-linux-${GITHUB_SHA::7}' -w -s -buildid=" \
            -o mihomo-linux-ebpf

      - name: Run real TC eBPF IPv4/IPv6 smoke
        run: |
          chmod +x .github/scripts/smart-ebpf-routing-smoke.sh
          .github/scripts/smart-ebpf-routing-smoke.sh "$PWD/mihomo-linux-ebpf"

      - name: Build Android arm64 Smart eBPF
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          export CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          go build -v -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-alpha-ebpf-${GITHUB_SHA::7}' -w -s -buildid=" \
            -o mihomo-android-arm64-smart-ebpf
          gzip -9 -c mihomo-android-arm64-smart-ebpf > mihomo-android-arm64-smart-ebpf.gz
          sha256sum mihomo-android-arm64-smart-ebpf.gz > EBPF_SHA256SUMS

      - name: Upload eBPF compatibility artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-alpha-ebpf-compat-${{ github.run_id }}
          path: |
            mihomo-android-arm64-smart-ebpf.gz
            EBPF_SHA256SUMS
            ebpf-applied-commits.txt
            .ebpf-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  android-arm64:
    name: Android arm64-v8 build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smart-unit

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Prepare CA bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Build Android Smart Alpha core
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          export CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          VERSION="smart-alpha-${GITHUB_SHA::7}"
          go build -v -buildvcs=false -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid=" \
            -o mihomo-android-arm64-v8
          gzip -9 -c mihomo-android-arm64-v8 > "mihomo-android-arm64-v8-${VERSION}.gz"
          sha256sum "mihomo-android-arm64-v8-${VERSION}.gz" > SHA256SUMS

      - name: Upload Android core
        uses: actions/upload-artifact@v7
        with:
          name: smart-alpha-android-arm64-${{ github.run_id }}
          path: |
            mihomo-android-arm64-v8-smart-alpha-*.gz
            SHA256SUMS
          retention-days: 14
