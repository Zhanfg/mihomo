name: IPv6 Resilience Gate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ipv6-resilience
    paths:
      - "adapter/capability.go"
      - "adapter/capability_tier_test.go"
      - "adapter/outboundgroup/smart.go"
      - "docs/ip-family-routing.md"
      - ".github/workflows/ipv6-resilience.yml"

permissions:
  contents: read

concurrency:
  group: ipv6-resilience-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Source identity
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=$HEAD_SHORT" >> "$GITHUB_ENV"

      - name: gofmt gate
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            adapter/capability.go
            adapter/capability_tier_test.go
            adapter/outboundgroup/smart.go
          )
          gofmt -d "${FILES[@]}" | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff

      - name: IP-family capability regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter -run 'Test(IPv4|IPv6|IPFamily|Capability|AutoIP|ExitCountry|FirstFamily)' -count=1
          go test ./adapter/outboundgroup -run 'Test(CustomIPFamily|RequireCapability|MissingASN)' -count=1

      - name: Full adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./adapter/... -count=1

      - name: Build Linux parser core
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=smart-ebpf-$HEAD_SHORT' -w -s -buildid="             -o mihomo-selftest

      - name: Parse BoxProxy and mobile configs
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo-selftest -t -f .github/fixtures/boxproxy-ebpf-listener.yaml 2>&1 | tee BOXPROXY_SELFTEST.txt
          ./mihomo-selftest -t -f .github/fixtures/ip-family-routing.yaml 2>&1 | tee IP_FAMILY_SELFTEST.txt
          ./mihomo-selftest -t -f .github/fixtures/mobile-core-opt.yaml 2>&1 | tee MOBILE_SELFTEST.txt

      - name: Build Android arm64
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          set -euo pipefail
          VERSION="smart-ebpf-$HEAD_SHORT"
          OUT="mihomo-a64-smart-ebpf-$HEAD_SHORT"
          go build -buildvcs=false -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -w -s -buildid="             -o "$OUT"
          test -s "$OUT"
          strings "$OUT" | grep -q "api6.ipify.org"
          strings "$OUT" | grep -q "api-ipv6.ip.sb/ip"
          gzip -9 -c "$OUT" > "$OUT.gz"
          sha256sum "$OUT" "$OUT.gz" > SHA256SUMS
          {
            echo "source=$HEAD_SHA"
            echo "version=$VERSION"
            echo "ipv6_probe=dual-single-stack-endpoint"
            echo "auto_ip_family=strong-demotion+availability-fallback"
            echo "target=android/arm64"
          } > BUILD_INFO.txt

      - uses: actions/upload-artifact@v7
        with:
          name: smart-ebpf-a64-ipv6-${{ env.HEAD_SHORT }}
          path: |
            mihomo-a64-smart-ebpf-*
            SHA256SUMS
            BUILD_INFO.txt
            BOXPROXY_SELFTEST.txt
            IP_FAMILY_SELFTEST.txt
            MOBILE_SELFTEST.txt
          if-no-files-found: error
          retention-days: 30
